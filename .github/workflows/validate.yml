name: Validate Agent Skill

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate SKILL.md Frontmatter & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - name: Validate SKILL.md frontmatter
        run: |
          python3 -c '
          import sys, yaml
          with open("SKILL.md", "r") as f:
              content = f.read()
          if not content.startswith("---"):
              print("Error: SKILL.md missing frontmatter start marker")
              sys.exit(1)
          parts = content.split("---", 2)
          if len(parts) < 3:
              print("Error: SKILL.md frontmatter improperly formatted")
              sys.exit(1)
          fm = yaml.safe_load(parts[1])
          required = ["name", "description", "license", "compatibility", "allowed-tools"]
          for req in required:
              if req not in fm:
                  print(f"Error: Missing required field {req}")
                  sys.exit(1)
          if "```bash" in content or "```powershell" in content:
              print("Error: SKILL.md must be the decision brain, no shell implementation inside it")
              sys.exit(1)
          print("✓ SKILL.md frontmatter validation passed!")
          '
      - name: bash -n scripts, installer, tests
        run: |
          for f in scripts/zlog.sh install.sh tests/test-posix.sh tests/test-install.sh; do
            bash -n "$f" || { echo "Error: $f failed bash -n"; exit 1; }
            echo "✓ $f passes bash -n"
          done
      - name: Architecture invariants (no impl in Markdown, no -L, no estimates)
        run: |
          python3 -c '
          import sys
          skill = open("SKILL.md").read()
          readme = open("README.md").read()
          sh = open("scripts/zlog.sh").read()
          ok = True
          def check(cond, msg):
              global ok
              print(("✓ " if cond else "FAIL: ") + msg)
              if not cond: ok = False
          check("find -L" not in sh, "scripts/zlog.sh never follows symlinks")
          check(sh.count("prune=(-name") + sh.count("PRUNE=(-name") == 1, "single canonical prune definition")
          check(sh.count("zlog_candidates() {") == 1, "single candidate definition (no duplicate)")
          check("mv -f" not in sh, "never overwrites an existing path (dest-absent + no-clobber everywhere)")
          check(sh.count("zlog_publish") >= 5, "all publishes go through the single no-clobber helper")
          check("Move-Item -Force" not in open("scripts/zlog.ps1").read(), "no clobbering move on Windows")
          check("*/AppData/*\"" not in sh, "deep scan has no broad AppData path")
          check("AppData/Local/Ollama" in sh, "deep scan keeps approved Ollama AppData path")
          check("77%" not in skill and "77%" not in readme, "no unmeasured % claims in docs")
          check("4-5x" not in skill and "4-5x" not in readme, "no ratio claims in docs")
          check("local/bin/zlog" not in skill and "local/bin/zlog" not in readme, "no stale CLI refs")
          for f in ["SKILL.md", "scripts/zlog.sh", "scripts/zlog.ps1",
                    "references/agent-paths.md", "references/safety.md", "references/formats.md"]:
              import os
              check(os.path.isfile(f), f"skill file present: {f}")
          sys.exit(0 if ok else 1)
          '
      - name: PowerShell parse checks (script + tests)
        shell: pwsh
        run: |
          foreach ($f in @('scripts/zlog.ps1', 'tests/test-powershell.ps1')) {
            $errs = $null; $toks = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$toks, [ref]$errs)
            if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Error "$f : $($_.Message)" }; exit 1 }
            Write-Host "✓ $f parses cleanly"
          }
  behavior-posix:
    name: Behavioral fixture tests (POSIX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - name: POSIX destructive-behavior fixtures
        run: |
          set -o pipefail
          bash tests/test-posix.sh scripts/zlog.sh | tee "$RUNNER_TEMP/posix-tests.txt"
      - name: Installer integration fixtures (stage/backup/rollback)
        run: bash tests/test-install.sh
      - name: Require TOCTOU race regression (must run, not skip)
        run: |
          grep -q 'PASS: race source preserved' "$RUNNER_TEMP/posix-tests.txt" || { echo 'Error: POSIX race regression did not run'; exit 1; }
  behavior-windows:
    name: Behavioral fixture tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - name: PowerShell destructive-behavior fixtures
        shell: pwsh
        run: |
          ./tests/test-powershell.ps1 -Script ./scripts/zlog.ps1 | Tee-Object -FilePath "$env:RUNNER_TEMP/win-tests.txt"
      - name: Require TOCTOU race regression (must run, not skip)
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP/win-tests.txt" -Pattern 'PASS: race source preserved' -Quiet)) { Write-Error 'Windows race regression did not run'; exit 1 }
