<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Title -->
  <text x="80" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="url(#textGrad)">zlog</text>
  <text x="240" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#8b949e">Multi-Agent Storage Optimizer</text>
  <text x="80" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1d9">Compress AI Agent Log Bloat Across 15+ Agent Runtimes</text>

  <!-- Metric Cards -->
  <!-- Card 1 -->
  <g transform="translate(80, 240)">
    <rect width="320" height="200" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="2"/>
    <text x="30" y="70" font-family="sans-serif" font-size="56" font-weight="900" fill="#3fb950">77%</text>
    <text x="30" y="115" font-family="sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">SSD Space Saved</text>
    <text x="30" y="150" font-family="sans-serif" font-size="16" fill="#8b949e">4.3x Average Compression</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(440, 240)">
    <rect width="320" height="200" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="2"/>
    <text x="30" y="70" font-family="sans-serif" font-size="56" font-weight="900" fill="#58a6ff">15+</text>
    <text x="30" y="115" font-family="sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">AI Runtimes</text>
    <text x="30" y="150" font-family="sans-serif" font-size="16" fill="#8b949e">Cursor, Claude, Gemini, Ollama</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(800, 240)">
    <rect width="320" height="200" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="2"/>
    <text x="30" y="70" font-family="sans-serif" font-size="56" font-weight="900" fill="#bc8cff">100%</text>
    <text x="30" y="115" font-family="sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Context Safe</text>
    <text x="30" y="150" font-family="sans-serif" font-size="16" fill="#8b949e">Transcripts & Locks Protected</text>
  </g>

  <!-- Terminal Snippet Footer -->
  <g transform="translate(80, 480)">
    <rect width="1040" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="30" y="40" font-family="monospace" font-size="18" fill="#79c0ff">$ curl -fsSL https://raw.githubusercontent.com/sebin-gg/zlog/main/install.sh | bash</text>
    <text x="30" y="68" font-family="sans-serif" font-size="14" fill="#8b949e">One-line universal installer for Linux, macOS, WSL &amp; Windows 11</text>
  </g>
</svg>
